<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3C Review Video Studio · 导演台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">3C</div>
        <div>
          <h1>Review Video Studio</h1>
          <p>导演台 · 一句话起片 · 横向时间线</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="status-pill" id="apiStatus">本地预览</span>
      </div>
    </header>

    <main class="director">
      <!-- 起片区：一句话起片 -->
      <section class="stage-bar">
        <div class="cue">
          <input id="productName" class="cue-input" type="text" placeholder="输入产品名，例如：华为Nova16" />
          <button class="cue-go" id="oneClickBtn" type="button">
            <i data-lucide="wand-sparkles"></i>
            <span>一键生成</span>
          </button>
          <button class="adv-toggle" id="advToggle" type="button" aria-expanded="false">
            <i data-lucide="sliders-horizontal"></i>
            <span>高级设置</span>
          </button>
        </div>
        <p class="cue-hint" id="cueHint">下面是示例分镜。输入产品名点「一键生成」：自动知乎搜索 → 抓取真实素材 → MiMo 生成分镜。</p>

        <div class="adv-panel" id="advPanel" hidden>
          <div class="field-grid">
            <label>
              <span>品类</span>
              <select id="category">
                <option>耳机</option>
                <option>手机</option>
                <option>平板</option>
                <option>笔记本</option>
                <option>显示器</option>
                <option>显卡</option>
                <option>智能穿戴</option>
              </select>
            </label>
            <label>
              <span>目标时长(秒)</span>
              <input id="targetDuration" type="number" min="30" max="240" step="5" value="90" />
            </label>
            <label>
              <span>视频平台</span>
              <select id="platform">
                <option>抖音 / 快手 9:16</option>
                <option>B站竖屏 9:16</option>
                <option>小红书 3:4</option>
                <option>视频号 9:16</option>
              </select>
            </label>
          </div>

          <div class="segmented" role="group" aria-label="真人出镜布局">
            <button class="segment active" data-layout="center" type="button">真人居中</button>
            <button class="segment" data-layout="left" type="button">真人左侧</button>
            <button class="segment" data-layout="pip" type="button">右下小窗</button>
            <button class="segment" data-layout="none" type="button">无真人</button>
          </div>

          <label class="upload-zone" for="assetInput">
            <input id="assetInput" type="file" accept="image/*,video/*" multiple />
            <i data-lucide="upload-cloud"></i>
            <span>上传产品实拍图或短视频（可选）</span>
          </label>
          <div class="asset-strip" id="assetStrip"></div>

          <label class="textarea-label">
            <span>产品事实（可选，帮助 MiMo 更准）</span>
            <textarea id="factsInput" rows="4"></textarea>
          </label>

          <label class="textarea-label">
            <span>后端地址（可选，留空走同源 Cloudflare）</span>
            <input id="apiBase" type="url" placeholder="https://your-codespace-8000.app.github.dev" />
          </label>
        </div>
      </section>

      <!-- 导演台主区 -->
      <section class="console panel">
        <div class="console-toolbar">
          <div class="metrics">
            <div><strong id="sceneCount">6</strong><span>分镜</span></div>
            <div><strong id="durationCount">90s</strong><span>总时长</span></div>
            <div><strong id="sourceCount">4</strong><span>观点来源</span></div>
          </div>
          <div class="toolbar-actions">
            <button class="icon-button" id="regenerateBtn" type="button" title="用当前素材重新生成">
              <i data-lucide="refresh-cw"></i><span>重新生成</span>
            </button>
            <button class="icon-button" id="addSceneBtn" type="button" title="在当前镜头后新增">
              <i data-lucide="plus"></i><span>加镜头</span>
            </button>
            <button class="icon-button" id="copyPromptBtn" type="button" title="复制 3C Prompt">
              <i data-lucide="clipboard-copy"></i><span>Prompt</span>
            </button>
            <button class="icon-button" id="downloadJsonBtn" type="button">
              <i data-lucide="download"></i><span>JSON</span>
            </button>
            <button class="icon-button" id="downloadBriefBtn" type="button">
              <i data-lucide="file-down"></i><span>方案</span>
            </button>
          </div>
        </div>

        <!-- 横向时间线轨道 -->
        <div class="track-wrap">
          <div class="track-ruler" id="trackRuler"></div>
          <div class="track" id="track"></div>
          <p class="track-tip">拖动卡片可调整顺序 · 点击卡片在下方编辑 · 时长按比例显示</p>
        </div>

        <!-- 预览 + 镜头编辑器 -->
        <div class="editor-row">
          <aside class="preview-col">
            <div class="scene-nav">
              <button class="square-button" id="prevSceneBtn" type="button" title="上一镜">
                <i data-lucide="chevron-left"></i>
              </button>
              <span id="sceneIndicator">1 / 6</span>
              <button class="square-button" id="nextSceneBtn" type="button" title="下一镜">
                <i data-lucide="chevron-right"></i>
              </button>
            </div>
            <div class="phone-frame">
              <div class="video-stage" id="videoStage">
                <div class="stage-topline">
                  <span id="stageProduct">3C 产品</span>
                  <span id="stageTime">00:00</span>
                </div>
                <div class="product-visual" id="productVisual">
                  <div class="device-placeholder"><span></span></div>
                </div>
                <div class="host-slot center" id="hostSlot">
                  <div class="host-head"></div>
                  <div class="host-body"></div>
                </div>
                <div class="info-card" id="infoCard">
                  <small id="visualType">结论</small>
                  <strong id="visualHeadline">先看结论</strong>
                  <span id="visualDetail">最大优点与最大限制</span>
                </div>
                <div class="subtitle-bar" id="subtitleBar"></div>
              </div>
            </div>
          </aside>

          <section class="clip-editor" id="clipEditor"></section>
        </div>

        <!-- 知乎来源与素材（可折叠） -->
        <details class="sources">
          <summary>
            <i data-lucide="book-open"></i>
            知乎来源与素材
          </summary>
          <div class="sources-body">
            <div class="zhihu-search">
              <label class="textarea-label">
                <span>知乎搜索关键词（留空则用产品名）</span>
                <input id="zhihuQuery" type="text" placeholder="如：华为Nova16 评测" />
              </label>
              <button class="icon-button" id="zhihuSearchBtn" type="button" title="用知乎搜索 API 拉取真实标题与内容">
                <i data-lucide="search"></i>
                <span>知乎搜索</span>
              </button>
            </div>
            <div class="zhihu-results" id="zhihuResults"></div>
            <label class="textarea-label">
              <span>知乎真实评测素材</span>
              <textarea id="reviewInput" rows="8"></textarea>
            </label>
          </div>
        </details>
      </section>
    </main>

    <pre id="jsonOutput" hidden></pre>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
